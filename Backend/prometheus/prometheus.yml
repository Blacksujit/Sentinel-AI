global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "sentinelai-api"
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - "sentinelai-api:8000"
        labels:
          service: sentinelai-api
          env: "${ENVIRONMENT:-development}"

  - job_name: "nginx"
    static_configs:
      - targets:
          - "sentinelai-nginx:80"
        labels:
          service: nginx
          env: "${ENVIRONMENT:-development}"

  - job_name: "postgres-exporter"
    static_configs:
      - targets:
          - "sentinelai-db:9187"
        labels:
          service: postgres
          env: "${ENVIRONMENT:-development}"

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"
