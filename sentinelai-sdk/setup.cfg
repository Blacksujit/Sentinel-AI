[metadata]
name = sentinelai-sdk
version = 1.0.0
author = SentinelAI Team
author_email = support@sentinelai.com
description = Official Python SDK for SentinelAI AI safety platform
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/Blacksujit/Sentinel-AI
project_urls =
    Bug Tracker = https://github.com/Blacksujit/Sentinel-AI/issues
    Documentation = https://github.com/Blacksujit/Sentinel-AI/tree/main/Docs
    Source Code = https://github.com/Blacksujit/Sentinel-AI
    Changelog = https://github.com/Blacksujit/Sentinel-AI/blob/main/sentinelai-sdk/CHANGELOG.md
classifiers =
    Development Status :: 5 - Production/Stable
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Software Development :: Libraries :: Python Modules
    Topic :: Scientific/Engineering :: Artificial Intelligence
    Topic :: Security
license = MIT
keywords = ai safety security monitoring chatbot moderation
metadata_version = 2.1

[options]
package_name = sentinelai
python_requires = >=3.8
install_requires =
    requests>=2.25.0

[options.packages.find]
where = .
exclude =
    tests*

[options.package_data]
* = LICENSE
