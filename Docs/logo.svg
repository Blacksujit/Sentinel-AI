<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2B42F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2bb5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Shield icon -->
  <g transform="translate(20, 10)">
    <path d="M40 0 L80 15 L80 55 Q80 80 40 95 Q0 80 0 55 L0 15 Z"
          fill="url(#grad)" opacity="0.95"/>
    <path d="M40 0 L80 15 L80 55 Q80 80 40 95 Q0 80 0 55 L0 15 Z"
          fill="none" stroke="#2B42F5" stroke-width="1.5" opacity="0.3"/>
    <!-- Checkmark inside shield -->
    <path d="M22 48 L35 62 L58 35"
          fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Radar arc -->
    <path d="M30 70 Q40 78 50 70"
          fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <!-- Small dots on radar wave -->
    <circle cx="27" cy="67" r="1.5" fill="white" opacity="0.4"/>
    <circle cx="53" cy="67" r="1.5" fill="white" opacity="0.4"/>
  </g>

  <!-- "SentinelAI" text -->
  <text x="120" y="50" font-family="Inter, 'Segoe UI', Arial, sans-serif"
        font-size="32" font-weight="700" fill="#1a1a2e" letter-spacing="-0.5">
    Sentinel<tspan fill="#2B42F5">AI</tspan>
  </text>

  <!-- Tagline -->
  <text x="120" y="74" font-family="Inter, 'Segoe UI', Arial, sans-serif"
        font-size="13" fill="#6b7280" font-weight="400" letter-spacing="0.3">
    AI Risk Monitoring &amp; Observability
  </text>

  <!-- Decorative line -->
  <line x1="120" y1="84" x2="370" y2="84" stroke="#e5e7eb" stroke-width="1"/>
</svg>
