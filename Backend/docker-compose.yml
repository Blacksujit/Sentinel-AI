version: '3.8'

services:
  sentinelai-backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PYTHON_VERSION=3.11
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://sentinelai_user:password@sentinelai-db:5432/sentinelai
    depends_on:
      - sentinelai-db
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  sentinelai-db:
    image: postgres:15
    environment:
      - POSTGRES_DB=sentinelai
      - POSTGRES_USER=sentinelai_user
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
