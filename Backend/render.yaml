services:
  # Web Service for SentinelAI Backend API
  - type: web
    name: sentinelai-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /api/health
    autoDeploy: true
    
  # PostgreSQL Database (optional - for persistent storage)
  - type: pserv
    name: sentinelai-db
    plan: free
    databaseName: sentinelai
    user: sentinelai_user
