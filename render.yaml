# Render Blueprint — Sentinel-AI Backend
# Docs: https://render.com/docs/blueprint-spec
#
# Async job queue modes:
#   - memory  (default): in-process broker; safe for a single instance, resets on restart
#   - redis   : Redis Streams, requires a Redis instance (uncomment the redis KV service
#               and set QUEUE_REDIS_URL from its connectionString)
#   - kafka   : install Backend/requirements-kafka.txt and set KAFKA_BOOTSTRAP_SERVERS

services:
  - type: web
    name: sentinel-ai-api
    runtime: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALLOW_SQLITE_FALLBACK
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-ai-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: QUEUE_MODE
        value: memory
      - key: QUEUE_MAX_RETRIES
        value: "3"
      # Uncomment to use the Redis Streams broker (and add the redis KV service below):
      # - key: QUEUE_MODE
      #   value: redis
      # - key: REDIS_URL
      #   fromDatabase:
      #     name: sentinel-ai-queue-redis
      #     property: connectionString
      - key: CLERK_JWT_PUBLIC_KEY
        value: |
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAmdubYDjREA5RtJd5hW1q
          M+EqQhcxcmbbX70CQxGGK6HqF9LGxgDf64ZEJFCVBMXM72u2lbjpT94y0HSmLegd
          ODDupY810nIJrWtuXQIO+eVA2xKajBCW3iptBB40DLwzIFstCu+t9zeOsVRZffca
          afVnuygZsilH+tIV0wPElpHMxh4GajgwBbt8g1M0zZV2+eJz3ajjOrUNpI5WnJ7F
          yqq1/d3rLHrNOe0161f+3ig82/g1ayf+/lxJe62OAIujntx28CurnL2+yI5xl/RM
          oWQB65VObeTjyef0ehUOdHo/cNNegcCElOMtfw2H776/OEdpIaVXSHhY7BUezipZ
          gwIDAQAB
          -----END PUBLIC KEY-----

databases:
  - name: sentinel-ai-db
    plan: free
    databaseName: sentinel_ai
    user: sentinel_ai
  # Optional Redis-backed queue / cross-instance pub-sub. Uncomment to enable
  # the QUEUE_MODE=redis path above:
  # - name: sentinel-ai-queue-redis
  #   type: redis
  #   plan: free
